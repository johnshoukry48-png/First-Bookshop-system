<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="soft">
<head>

<title>First-Bookshop</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>

[data-theme=dark]{--bg:#1a2026;--card:#232b32;--tx:#d9dfe4;--mu:#97a4ae;--bd:#37424b;--ac:#6fa9c9;--ac2:#4f8fb2;--ok:#5fb383;--er:#e07a74;--wa:#d8a24e;--side:#141a1f;--sidetx:#c4d0d6;--inp:#1c2329;--hd:#2b343c;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.num,td.n,th.n,input.num{direction:ltr;unicode-bidi:plaintext;font-variant-numeric:tabular-nums}
td.n,th.n{text-align:left}
#app{height:100%}
/* ===== شاشات الدخول والإعداد ===== */
.center{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--side),var(--ac))}
.box{background:var(--card);border-radius:20px;padding:32px;width:100%;max-width:410px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.box h1{margin:0 0 4px;font-size:22px}.box p{color:var(--mu);margin:0 0 18px}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--ac),#6aa0ff);display:grid;place-items:center;color:#fff;font-size:28px;margin-bottom:12px}
/* ===== التخطيط ===== */
.shell{display:flex;height:100%}
.side{width:248px;background:var(--side);color:var(--sidetx);display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s;z-index:40}

.side .brand b{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--ac),#6aa0ff);display:grid;place-items:center;font-size:20px}
.side nav{flex:1;overflow:auto;padding:6px 10px}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:11px;color:var(--sidetx);text-decoration:none;margin-bottom:2px;font-weight:500}
.side a:hover{background:rgba(255,255,255,.08)}.side a.on{background:var(--ac);color:#fff}
.side .grp{font-size:12px;opacity:.55;margin:12px 12px 4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
.top h2{margin:0;font-size:19px;flex:1}
.page{flex:1;overflow:auto;padding:18px 20px 40px}
.btn.burger{display:none}
.side .brand img{width:38px;height:38px;border-radius:10px;object-fit:contain;background:#fff;padding:2px}
body.ro .wr,body.ro [data-sv],body.ro [data-dl],body.ro #mA{display:none!important}body.ro #msbox input,body.ro #msbox select{pointer-events:none;opacity:.85}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--hd)}
.pm-بنك{color:var(--ac)}.pm-بريد{color:var(--wa)}
.scrim{display:none}
@media(max-width:900px){.side{position:fixed;inset:0 0 0 auto;transform:translateX(100%)}.side.open{transform:none}.btn.burger{display:inline-flex}.scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}.page{padding:12px 12px 40px}}
/* ===== عناصر ===== */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(3,1fr)}@media(min-width:1500px){.g6{grid-template-columns:repeat(6,1fr)}}
@media(max-width:1100px){.g4,.g6{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}
.kpi{padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh)}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:22px;display:block;margin-top:2px}.kpi.ac{border-top:3px solid var(--ac)}.kpi.ok{border-top:3px solid var(--ok)}.kpi.er{border-top:3px solid var(--er)}.kpi.wa{border-top:3px solid var(--wa)}
label.l{display:block;font-size:13px;font-weight:700;margin:0 0 4px;color:var(--mu)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--inp);color:var(--tx);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,91,234,.18)}
input[type=checkbox]{width:auto}
.btn{border:0;background:var(--ac);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--ac2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.gh{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.gh:hover{background:var(--hd)}
.btn.er{background:var(--er)}.btn.ok{background:var(--ok)}.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:140px}.row>.fit{flex:0 0 auto;min-width:0}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;max-height:68vh}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--hd);position:sticky;top:0;z-index:2;text-align:right;padding:9px 10px;white-space:nowrap;font-weight:700;border-bottom:1px solid var(--bd)}
td{padding:7px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
tbody tr:hover{background:var(--hd)}
tfoot td{background:var(--hd);font-weight:800;position:sticky;bottom:0}
.pos{color:var(--ok)}.neg{color:var(--er)}.mut{color:var(--mu)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--hd)}.tag.er{background:rgba(220,38,38,.12);color:var(--er)}.tag.ok{background:rgba(22,163,74,.12);color:var(--ok)}.tag.wa{background:rgba(217,119,6,.14);color:var(--wa)}
.toast{position:fixed;bottom:18px;left:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast div{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--sh);animation:up .25s}.toast .e{background:var(--er);color:#fff}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
tfoot td{background:var(--hd);font-weight:800}.ta{position:fixed;z-index:200;background:var(--card);border:1px solid var(--ac);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:42vh;overflow:auto;-webkit-overflow-scrolling:touch}.ta div{padding:11px 12px;border-bottom:1px solid var(--bd);cursor:pointer}.ta div.on,.ta div:hover{background:var(--hd)}.ta b{color:var(--ac)}.dirtybar{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--ac);padding:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;z-index:5}tr.dirty td{background:rgba(217,119,6,.12)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:70;padding:14px}
.modal .m{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:620px;max-height:92vh;overflow:auto}
.bar{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0}.bar .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:11px;color:var(--mu)}
.bar .p{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}.bar .p i{display:block;width:40%;border-radius:5px 5px 0 0;min-height:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px}
.note{background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.35);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:700}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.eq{display:grid;grid-template-columns:1fr auto;gap:6px 14px}.eq .t{font-weight:800;border-top:2px solid var(--bd);padding-top:6px}
.sp{height:10px}
table th,table td{text-align:center!important}td input,td select{text-align:center}
.newh{display:block;font-size:12px;color:var(--wa);margin-top:2px;font-weight:700}
.due{padding:9px 11px;border:1px dashed var(--ac);border-radius:10px;font-weight:800;color:var(--ac);background:var(--hd);text-align:center}
.chk2{display:flex;gap:6px;align-items:center;margin-top:26px;font-weight:700}
@media print{.side,.top,.noprint,.toast{display:none!important}.page{overflow:visible;padding:0}.tw{max-height:none;overflow:visible;border:0}body{background:#fff;color:#000}.card{box-shadow:none}}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
/* =====================================================================
   إعدادات الاتصال بـ Supabase — ضع القيمتين هنا (أو أدخلهما من شاشة الإعداد الأولى)
   Project Settings ▸ API ▸ Project URL  و  anon public key
   ===================================================================== */
const PRODUCTION = true;   // نسخة الإنتاج: true (تُخفي الوضع التجريبي)
const CFG = window.APP_CONFIG || {};
const SUPABASE_URL = CFG.url || '';
const SUPABASE_ANON_KEY = CFG.key || '';

/* ============================ أدوات ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const x = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(x) ? x : 0; };
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const fmt = x => (x == null || isNaN(x)) ? '—' : Number(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = x => (x == null || !isFinite(x)) ? '—' : (x * 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
const cls = x => x > 0.005 ? 'pos' : x < -0.005 ? 'neg' : '';
const today = () => new Date().toISOString().slice(0, 10);
const norm = s => String(s || '').replace(/[ً-ْـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim().toLowerCase();
const MONTHS_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const monthLabel = k => { if (!k) return ''; if (k === 'opening') return 'افتتاحي'; const [y, m] = k.split('-'); return `${MONTHS_AR[+m - 1] || m} ${y}`; };
function toast(msg, err) { const d = document.createElement('div'); if (err) d.className = 'e'; d.textContent = msg; $('#toast').appendChild(d); setTimeout(() => d.remove(), err ? 6000 : 3000); }
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
/* تفضيلات الطباعة: تُحفظ فوراً في المتصفح وتُزامَن مع حساب المستخدم ليحتفظ بها على كل الأجهزة */
const prefGet = k => { try { return JSON.parse(lsGet(k, '{}')) || {}; } catch (e) { return {}; } };
let prefTimer = null;
function prefSet(k, v) {
  lsSet(k, JSON.stringify(v)); clearTimeout(prefTimer);
  prefTimer = setTimeout(() => { try { if (!sb || !sb.auth || !sb.auth.updateUser) return; const all = {}; for (let i = 0; i < localStorage.length; i++) { const kk = localStorage.key(i); if (kk && kk.startsWith('print_')) all[kk] = lsGet(kk, ''); } const r = sb.auth.updateUser({ data: { print_prefs: all } }); r && r.catch && r.catch(() => {}); } catch (e) {} }, 800);
}
function prefPull(user) { try { const pp = user && user.user_metadata && user.user_metadata.print_prefs; if (pp) Object.keys(pp).forEach(k => { if (k.startsWith('print_') && lsGet(k, null) == null) lsSet(k, pp[k]); }); } catch (e) {} }
function dl(name, text, type = 'text/csv;charset=utf-8') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
const THEMES = ['soft', 'sepia', 'dark', 'light'], TN = { soft: 'هادئ', sepia: 'ورقي دافئ', dark: 'داكن', light: 'فاتح' };
const setTheme = t => { document.documentElement.dataset.theme = t; lsSet('theme', t); };
const PMS = ['نقدى', 'بنك', 'بريد'];
const appName = () => lsGet('name_cache', '') || 'First-Bookshop';
function applyBrand() {
  document.title = appName();
  const lg = lsGet('logo_cache', ''); let l = document.querySelector('link[rel=icon]');
  if (lg) { if (!l) { l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); } l.href = lg; }
}
const mv = v => { if (v == null || v === '' || isNaN(Number(v))) return ''; const n = Number(v); const [a, b] = String(Math.abs(n)).split('.'); return (n < 0 ? '-' : '') + a.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (b ? '.' + b.slice(0, 2) : ''); };
/* حقول المبالغ: فواصل الآلاف أثناء الكتابة */
document.addEventListener('input', e => {
  const t = e.target; if (!t || !t.classList) return;
  if (t.classList.contains('money')) {
    const pos = t.selectionStart, raw = t.value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)), keep = raw.slice(0, pos).replace(/[^\d.]/g, '').length;
    let v = raw.replace(/[^\d.\-]/g, ''); const neg = v.startsWith('-'); v = v.replace(/-/g, ''); const p = v.split('.'); let ip = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','), out = (neg ? '-' : '') + ip + (p.length > 1 ? '.' + p.slice(1).join('').slice(0, 2) : '');
    if (out !== t.value) { t.value = out; let c = 0, i = 0; for (; i < out.length && c < keep; i++) if (/[\d.]/.test(out[i])) c++; try { t.setSelectionRange(i, i); } catch (x) {} }
  }
  if (t.dataset && t.dataset.ref) {   // تنبيه: اسم جديد سيُضاف تلقائياً
    let h = t.parentElement.querySelector('.newh'); if (!h) { h = document.createElement('small'); h.className = 'newh'; t.insertAdjacentElement('afterend', h); }
    const name = t.value.trim(), list = (S.data[t.dataset.ref] || []);
    h.textContent = name && !list.some(x => norm(x.name) === norm(name)) ? '➕ ' + (t.dataset.ref === 'customers' ? 'عميل' : 'ناشر') + ' جديد — سيُضاف تلقائياً عند الحفظ' : '';
  }
});
/* منع اقتراحات المتصفح + قائمة اقتراحات مخصصة (تعمل جيداً على الموبايل) */
(function () {
  const fix = el => { if (el.matches && el.matches('input,select,textarea') && el.autocomplete !== 'off') { el.setAttribute('autocomplete', 'off'); if (el.matches('input[type=text],input:not([type])')) { el.setAttribute('autocorrect', 'off'); el.setAttribute('spellcheck', 'false'); } } if (el.matches && el.matches('input[list]')) { el.dataset.dl = el.getAttribute('list'); el.removeAttribute('list'); } };
  const scan = root => { if (root.nodeType !== 1) return; fix(root); root.querySelectorAll && root.querySelectorAll('input,select,textarea').forEach(fix); };
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(scan))).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', () => scan(document.body));
  let box = null, cur = null, idx = -1;
  const hide = () => { if (box) box.remove(); box = null; cur = null; idx = -1; };
  const show = inp => {
    const dl = inp.dataset.dl && document.getElementById(inp.dataset.dl); if (!dl) return hide();
    const q = norm(inp.value), all = [...dl.options].map(o => o.value);
    let list = all.filter(v => !q || norm(v).includes(q)); list.sort((a, b) => (norm(b).startsWith(q) ? 1 : 0) - (norm(a).startsWith(q) ? 1 : 0)); list = list.filter(v => norm(v) !== q || list.length > 1).slice(0, 60);
    if (!list.length) return hide();
    if (!box) { box = document.createElement('div'); box.className = 'ta'; document.body.appendChild(box); }
    cur = inp; idx = -1; const r = inp.getBoundingClientRect(); box.style.width = r.width + 'px'; box.style.right = 'auto'; box.style.left = r.left + 'px';
    const below = innerHeight - r.bottom; if (below < 200 && r.top > below) { box.style.top = 'auto'; box.style.bottom = (innerHeight - r.top + 2) + 'px'; box.style.maxHeight = Math.min(innerHeight * .42, r.top - 10) + 'px'; } else { box.style.bottom = 'auto'; box.style.top = (r.bottom + 2) + 'px'; box.style.maxHeight = Math.min(innerHeight * .42, below - 10) + 'px'; }
    box.innerHTML = list.map(v => { const k = q ? norm(v).indexOf(q) : -1; return `<div data-v="${esc(v)}">${k >= 0 && q ? esc(v.slice(0, k)) + '<b>' + esc(v.slice(k, k + q.length)) + '</b>' + esc(v.slice(k + q.length)) : esc(v)}</div>`; }).join('');
  };
  const pick = v => { const i = cur; hide(); if (!i) return; i.value = v; i.dispatchEvent(new Event('input', { bubbles: true })); i.dispatchEvent(new Event('change', { bubbles: true })); };
  document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.dl) show(e.target); });
  document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.dl && e.isTrusted !== false) show(e.target); });
  document.addEventListener('mousedown', e => { const d = e.target.closest && e.target.closest('.ta div'); if (d) { e.preventDefault(); pick(d.dataset.v); } else if (box && e.target !== cur) hide(); });
  document.addEventListener('touchend', e => { const d = e.target.closest && e.target.closest('.ta div'); if (d) { e.preventDefault(); pick(d.dataset.v); } }, { passive: false });
  document.addEventListener('focusout', e => { if (e.target === cur) setTimeout(() => { if (document.activeElement !== cur) hide(); }, 150); });
  document.addEventListener('keydown', e => { if (!box || e.target !== cur) return; const it = [...box.children]; if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + it.length) % it.length; it.forEach((x, i) => x.classList.toggle('on', i === idx)); it[idx].scrollIntoView({ block: 'nearest' }); } else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); pick(it[idx].dataset.v); } else if (e.key === 'Escape') hide(); });
  addEventListener('resize', hide);
})();
function sortSales(rows) {   // الفواتير بالرقم تصاعدياً؛ الدفعة (بلا فاتورة) تأتي بعد آخر فاتورة سابقة لها (بترتيب التسجيل أو بالتاريخ — الأكبر منهما)
  const all = (S.data.sales || []).slice().sort((a, b) => a.id - b.id), key = new Map(), invs = []; let mx = 0;

/** بند معلق نشط في الشهر k: أُدخل فيه أو رُحِّل إليه ولم يُسدَّد قبله */
const pendActive = (p, k) => p.month <= k && (p.month === k || p.carry !== false) && !(p.settled && (p.settled_month || p.month) <= k);
const varLabel = v => v < -0.005 ? 'عجز' : v > 0.005 ? 'زيادة' : 'متوازن';
/** ورقة "الخزنة": إغلاق كل شهر وترحيله للشهر التالي */
function treasuryChain() {
  const months = [...S.data.treasury_months].sort((a, b) => a.month.localeCompare(b.month));
  const sal = S.data.sales, pur = S.data.purchases, exp = S.data.expenses, pend = S.data.pending_items;
  const out = []; let prev = null;
  months.forEach(m => {
    const k = m.month, sm = sal.filter(r => r.period === k), pm = pur.filter(r => r.period === k), em = exp.filter(r => r.period === k);
    const opening = m.opening_override != null ? num(m.opening_override) : (prev ? prev.closing : 0);
    const salesV = sum(sm, r => r.invoice_value), collect = sum(sm, r => r.payments);
    const o = { month: k, row: m, opening, salesV, collect, inTotal: opening + salesV + collect,
      expenses: sum(em, r => r.amount), commission: sum(sm, r => r.commission), creditSales: sum(sm, r => r.credit),
      pubPay: sum(pm, r => r.payments), cashPurch: sum(pm, r => r.cash_purchases) };
    o.outTotal = o.expenses + o.commission + o.creditSales + o.pubPay + o.cashPurch;
    o.bm = Object.fromEntries([...PMS, 'معلق'].map(x => [x, { in: 0, out: 0 }]));
    const pmOf = r => PMS.includes(r.pay_method) ? r.pay_method : 'نقدى';
    sm.forEach(r => { o.bm[r.is_pending ? 'معلق' : pmOf(r)].in += num(r.invoice_value) - num(r.commission) - num(r.credit) + num(r.payments); });
    pm.forEach(r => { o.bm[pmOf(r)].out += num(r.payments) + num(r.cash_purchases); });
    em.forEach(r => { o.bm[pmOf(r)].out += num(r.amount); });
    o.closing = o.inTotal - o.outTotal;                         // خزينة جديدة (خزنة ورقى)
    o.pending = sum(pend.filter(p => pendActive(p, k)), p => p.amount);   // المعلق: يُحتسب كمبلغ موجود (فواتير نقدى لم تسدد / سلف)
    o.holdings = num(m.cash_box) + num(m.drawer) + num(m.post) + num(m.bank);
    o.actual = o.holdings + o.pending;                           // الجرد الفعلي + المعلق
    o.variance = o.actual - o.closing;                           // سالب = عجز، موجب = زيادة
    o.cash = num(m.cash_box) + num(m.drawer);
    out.push(o); prev = o;
  });
  return out;
}

function wireSales(idp, row) {

  await load('customers', 'publishers', 'sales', 'purchases', 'expenses', 'customer_returns', 'publisher_returns', 'treasury_months', 'pending_items', 'adjustments', 'app_settings');
  const chain = treasuryChain(); const sel = gridState.dash = gridState.dash || {};
  const withData = chain.filter(c => c.salesV || c.collect || c.expenses);
  const cur = sel.month || (withData.length ? withData[withData.length - 1].month : (chain[0] || {}).month);
  const c = chain.find(x => x.month === cur) || {};
  const cb = customerBalances('الكل', false), pb = publisherBalances('الكل', false);
  const alerts = cb.rows.filter(r => r.alert);
  const top = cb.rows.slice().sort((a, b) => b.net - a.net).slice(0, 10);
  const mx = Math.max(1, ...chain.map(x => Math.max(x.salesV, x.collect)));
  $('#page').innerHTML = `<div class="row noprint" style="margin-bottom:12px"><div class="fit"><label class="l">الشهر</label><select id="dm">${chain.map(x => `<option value="${x.month}" ${x.month === cur ? 'selected' : ''}>${monthLabel(x.month)}</option>`).join('')}</select></div><div class="fit"><button class="btn gh" id="dprint">🖨️ طباعة</button></div></div>
   <div data-psec data-plabel="مؤشرات الخزنة (مصروفات، كاش، خزنة، بنك، بريد، العجز/الزيادة)"><div class="grid g6"><div class="kpi er"><small>مصروفات الشهر</small><b class="num">${fmt(c.expenses)}</b></div><div class="kpi ac"><small>كاش (خزنة نقدى + الدرج)</small><b class="num">${fmt(c.cash)}</b></div><div class="kpi ok"><small>الخزنة (خزنة ورقى)</small><b class="num">${fmt(c.closing)}</b></div><div class="kpi ac"><small>البنك</small><b class="num">${fmt(c.row && c.row.bank)}</b></div><div class="kpi ac"><small>البريد</small><b class="num">${fmt(c.row && c.row.post)}</b></div><div class="kpi ${Math.abs(c.variance || 0) < 1 ? 'ok' : 'wa'}"><small>الجرد: ${varLabel(c.variance || 0)}</small><b class="num ${cls(c.variance)}">${fmt(Math.abs(c.variance || 0))}</b></div></div></div><div class="sp"></div>
   <div data-psec data-plabel="المبيعات والتحصيل والأرصدة"><div class="grid g4"><div class="kpi"><small>مبيعات الشهر</small><b class="num">${fmt(c.salesV)}</b></div><div class="kpi"><small>تحصيل الشهر</small><b class="num">${fmt(c.collect)}</b></div><div class="kpi wa"><small>صافي أرصدة العملاء</small><b class="num">${fmt(cb.total.net)}</b></div><div class="kpi wa"><small>صافي أرصدة الناشرين</small><b class="num">${fmt(pb.total.net)}</b></div></div></div><div class="sp"></div>
   <div class="grid g2"><div class="card" data-psec data-plabel="رسم المبيعات والتحصيل شهرياً"><h3>المبيعات والتحصيل شهرياً</h3><div class="bar">${chain.map(x => `<div class="c"><div class="p"><i style="height:${x.salesV / mx * 100}%;background:var(--ac)" title="${fmt(x.salesV)}"></i><i style="height:${x.collect / mx * 100}%;background:var(--ok)" title="${fmt(x.collect)}"></i></div>${(x.month.split('-')[1])}</div>`).join('')}</div><div class="legend"><span><i style="background:var(--ac)"></i>مبيعات</span><span><i style="background:var(--ok)"></i>تحصيل</span></div></div>
   <div class="card" data-psec data-plabel="تنبيهات الحد الائتماني"><h3>⚠️ تنبيهات الحد الائتماني <span class="tag ${alerts.length ? 'er' : 'ok'}">${alerts.length}</span></h3>${alerts.length ? `<div class="tw"><table><tbody>${alerts.map(r => `<tr><td>${esc(r.name)}</td><td class="n">${fmt(r.limit)}</td><td><span class="tag er">${r.alert}</span></td></tr>`).join('')}</tbody></table></div>` : '<div class="mut">لا توجد تنبيهات. (حدّد الحد الائتماني للعميل من صفحة «العملاء والناشرون»)</div>'}</div></div>
   <div class="card" data-psec data-plabel="أعلى 10 أرصدة مستحقة على العملاء"><h3>أعلى 10 أرصدة مستحقة على العملاء</h3><div class="tw"><table><thead><tr><th>العميل</th><th class="n">المسحوبات</th><th class="n">المدفوعات</th><th class="n">الصافي</th><th class="n">نسبة السداد</th></tr></thead><tbody>${top.map(r => `<tr><td>${esc(r.name)}</td><td class="n">${fmt(r.w)}</td><td class="n">${fmt(r.p)}</td><td class="n neg">${fmt(r.net)}</td><td class="n">${pct(r.pct)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#dm').onchange = e => { sel.month = e.target.value; pageDashboard(); };
  $('#dprint').onclick = () => printSections('لوحة المعلومات');
}

async function pageBalances(kind) {
  await load('customers', 'publishers', 'sales', 'purchases', 'customer_returns', 'publisher_returns', 'adjustments', 'app_settings');
  const gs = gridState['bal' + kind] = gridState['bal' + kind] || { term: 'الكل', hidden: false, q: '', tcols: false };
  const isC = kind === 'c';
  const TC = isC ? ['مرتجع الترم الاول', 'الصافى بعد المرتجع (ت1)', 'نسبة المرتجع', 'مرتجع الترم التانى', 'الصافي بعد المرتجع (ت2)', 'النسبه المدفوعة (ت2)'] : ['مرتجع الترم الاول', 'الصافى بعد المرتجع (ت1)', 'النسبة المدفوعة (ت1)', 'مرتجع الترم التانى', 'الصافي بعد المرتجع (ت2)', 'النسبه المدفوعة (ت2)'];
  const draw = () => {
    const d = isC ? customerBalances(gs.term, gs.hidden) : publisherBalances(gs.term, gs.hidden);
    const rows = d.rows.filter(r => !gs.q || norm(r.name).includes(norm(gs.q)));
    const head0 = isC ? ['اسم العميل', 'المسحوبات', 'المدفوعات', 'تسويات', 'الصافي', 'المرتجع', 'الصافي بعد المرتجع', 'العمولة', 'النسبة المدفوعة', 'الحد الائتماني', 'التنبيه'] : ['اسم الناشر', 'المسحوبات', 'الدفعات', 'تسويات', 'الصافي', 'المرتجع', 'الصافي بعد المرتجع', 'النسبه المدفوعة'];
    const head = gs.tcols ? [...head0, ...TC] : head0;
    const line = (r, tot) => {
      const nm = tot ? 'الاجمالى' : `<a href="#/stmt-${kind}/${r.id}" style="color:var(--ac);text-decoration:none">${esc(r.name)}</a>${r.hidden ? ' <span class="tag">مخفي في Excel</span>' : ''}`;
      const core = [nm, fmt(r.w), fmt(r.p), `<span class="${cls(r.adj)}">${fmt(r.adj)}</span>`, `<span class="${cls(r.net)}">${fmt(r.net)}</span>`, fmt(r.ret), `<b class="${cls(r.netR)}">${fmt(r.netR)}</b>`];
      const base = isC ? [...core, fmt(r.com), pct(r.pct), tot ? '' : fmt(r.limit), tot ? '' : (r.alert ? `<span class="tag er">${r.alert}</span>` : '')] : [...core, pct(r.pct)];
      const tc = [fmt(r.r1), fmt(r.net1), pct(isC ? r.rr1 : r.pct1), fmt(r.r2), fmt(r.net2), pct(r.pct2)];
      return gs.tcols ? [...base, ...tc] : base;
    };
    $('#balbox').innerHTML = `<div class="mut" style="margin-bottom:6px">عدد الحسابات: <b class="num">${rows.length}</b></div><div class="tw"><table><thead><tr>${head.map((h, i) => `<th class="${i ? 'n' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${line(r).map((c, i) => `<td class="${i ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr>${line(d.total, true).map((c, i) => `<td class="${i ? 'n' : ''}">${c}</td>`).join('')}</tr></tfoot></table></div>`;
    gs.rows = rows; gs.head = head; gs.line = line;
  };
  $('#page').innerHTML = `<div class="card noprint"><div class="row"><div class="fit"><label class="l">الترم</label><select id="bt">${['الكل', ...TERMS].map(t => `<option ${gs.term === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div><div><label class="l">بحث</label><input id="bq" value="${esc(gs.q)}" placeholder="اسم الحساب"></div><div class="fit"><label class="chk" style="display:flex;gap:6px;align-items:center;margin-bottom:9px"><input type="checkbox" id="bh" ${gs.hidden ? 'checked' : ''}> إظهار الحسابات المخفية في Excel</label></div><div class="fit"><label class="chk" style="display:flex;gap:6px;align-items:center;margin-bottom:9px"><input type="checkbox" id="btc" ${gs.tcols ? 'checked' : ''}> أعمدة الترمين (Excel)</label></div><div class="fit"><button class="btn gh" id="bcsv">⬇️ CSV</button> <button class="btn gh" id="bprint">🖨️ طباعة</button></div></div></div><div class="note" style="margin-top:-4px">«تسويات» = عمولات/إضافات مسجلة في تبويب «تسويات الحساب» وتؤثر على الرصيد فقط، ولا تدخل الخزنة. «المرتجع» و«الصافي بعد المرتجع» بجوار كل حساب في نفس الصف.</div><div class="card" id="balbox"></div>`;
  draw();
  $('#bt').onchange = e => { gs.term = e.target.value; draw(); }; $('#bq').oninput = e => { gs.q = e.target.value; draw(); }; $('#bh').onchange = e => { gs.hidden = e.target.checked; draw(); }; $('#btc').onchange = e => { gs.tcols = e.target.checked; draw(); };
  $('#bprint').onclick = () => printDialog(balPrintCfg(isC), { term: gs.term === 'الكل' ? '' : gs.term, hidden: gs.hidden });
  $('#bcsv').onclick = () => dl(isC ? 'ارصدة_العملاء.csv' : 'ارصدة_الناشرين.csv', toCsv(gs.head, gs.rows.map(r => gs.line(r).map(x => String(x).replace(/<[^>]*>/g, '').replace(/,/g, '')))));
}

async function pageStatement(kind, id) {
  await load('customers', 'publishers', 'sales', 'purchases', 'customer_returns', 'publisher_returns', 'adjustments', 'app_settings');
  const isC = kind === 'c'; const list = isC ? S.data.customers : S.data.publishers;
  const gs = gridState['st' + kind] = gridState['st' + kind] || { term: 'الكل' }; if (id) gs.id = +id;
  const draw = () => {
    const ent = list.find(x => x.id === gs.id);
    if (!ent) { $('#stbox').innerHTML = '<div class="mut">اختر ' + (isC ? 'عميلاً' : 'ناشراً') + ' لعرض كشف الحساب.</div>'; return; }
    const { rows, total } = stmtRows(isC, ent, { term: gs.term === 'الكل' ? '' : gs.term }), cols = stmtCols(isC), net = total.credit - total.payments;
    const cell = (c, r) => c.t === 'm' ? `<td class="n ${c.k === 'run' ? cls(r[c.k]) : ''}">${fmt(r[c.k])}</td>` : c.k === 'kind' && r.kind !== 'حركة' ? `<td><span class="tag ${r.kind === 'مرتجع' ? 'wa' : 'ok'}">${r.kind}</span></td>` : `<td${c.k === 'note' ? ' style="white-space:normal;min-width:160px"' : ''}>${esc(r[c.k])}</td>`;
    $('#stbox').innerHTML = `<div class="grid g4"><div class="kpi"><small>${isC ? 'عدد الفواتير' : 'عدد الحركات'}</small><b class="num">${rows.filter(r => r.kind === 'حركة').length}</b></div>${isC ? `<div class="kpi"><small>العمولة</small><b class="num">${fmt(total.commission)}</b></div>` : `<div class="kpi"><small>مشتريات نقدى</small><b class="num">${fmt(total.cash_purchases)}</b></div>`}<div class="kpi"><small>المسحوبات (شاملة التسويات)</small><b class="num">${fmt(total.credit)}</b></div><div class="kpi"><small>الدفعات (شاملة التسويات)</small><b class="num">${fmt(total.payments)}</b></div></div><div class="sp"></div>
     <div class="grid g3"><div class="kpi ${net > 0 ? 'wa' : 'ok'}"><small>الصافى (المسحوبات − الدفعات)</small><b class="num ${cls(net)}">${fmt(net)}</b></div><div class="kpi"><small>المرتجع</small><b class="num">${fmt(total.ret)}</b></div><div class="kpi ${net - total.ret > 0 ? 'wa' : 'ok'}"><small>الصافي بعد خصم المرتجع</small><b class="num ${cls(net - total.ret)}">${fmt(net - total.ret)}</b></div></div><div class="sp"></div>
     <div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.t === 'm' ? 'n' : ''}">${c.l}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => cell(c, r)).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="mut" style="text-align:center;padding:20px">لا يوجد بيانات</td></tr>`}</tbody></table></div>`;
    gs.cur = { ent, rows, cols };
  };
  $('#page').innerHTML = `<div class="card noprint"><div class="row"><div><label class="l">${isC ? 'اسم العميل' : 'اسم الناشر'}</label><input id="sn" list="sn_dl" value="${esc((list.find(x => x.id === gs.id) || {}).name || '')}" placeholder="اكتب أو اختر"><datalist id="sn_dl">${list.map(x => `<option value="${esc(x.name)}">`).join('')}</datalist></div><div class="fit"><label class="l">الترم</label><select id="st">${['الكل', ...TERMS].map(t => `<option ${gs.term === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div><div class="fit"><button class="btn gh" id="scsv">⬇️ CSV</button> <button class="btn gh" id="sprint">🖨️ طباعة</button></div></div></div><div class="card"><h3 id="sth">${esc((list.find(x => x.id === gs.id) || {}).name || '')}</h3><div id="stbox"></div></div>`;
  draw();
  $('#sn').onchange = e => { const m = list.find(x => norm(x.name) === norm(e.target.value)); gs.id = m ? m.id : null; $('#sth').textContent = m ? m.name : ''; draw(); };
  $('#st').onchange = e => { gs.term = e.target.value; draw(); };
  $('#sprint').onclick = () => { const en = list.find(x => x.id === gs.id); if (!en) return toast('اختر ' + (isC ? 'العميل' : 'الناشر') + ' أولاً', 1); printDialog(stmtPrintCfg(isC, en), { term: gs.term === 'الكل' ? '' : gs.term }); };
  $('#scsv').onclick = () => { if (!gs.cur) return; const { rows, cols } = gs.cur; dl('كشف_حساب.csv', toCsv(cols.map(c => c.l), rows.map(r => cols.map(c => r[c.k])))); };
}

function miniModal(title, html, onSave) {
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="m" style="max-width:460px"><h3>${esc(title)}</h3>${html}<div class="sp"></div><div class="row"><button class="btn fit" id="mmS">💾 حفظ</button><button class="btn gh fit" id="mmC">إلغاء</button></div></div>`;
  document.body.appendChild(m); $('#mmC', m).onclick = () => m.remove();
  $('#mmS', m).onclick = async () => { try { await onSave(m); m.remove(); } catch (err) { toast(err.message, 1); } };
}
/** المعلق: تعديل البند، وسداد كلي أو جزئي (الجزئي يُغلق البند ويفتح بند بالمتبقي من هذا الشهر) */
function pendActions(cur, reload) {
  const item = id => S.data.pending_items.find(x => x.id === id);
  $$('[data-pe]').forEach(b => b.onclick = () => { const p = item(+b.dataset.pe); miniModal('تعديل بند معلق', `<label class="l">البيان</label><input id="pe_l" value="${esc(p.label)}"><div class="sp"></div><label class="l">المبلغ</label><input id="pe_a" class="num money" inputmode="decimal" value="${mv(p.amount)}">`,
    async m => { const a = r2(num($('#pe_a', m).value)); if (!(a > 0)) throw new Error('أدخل مبلغاً صحيحاً'); const { error } = await sb.from('pending_items').update({ label: $('#pe_l', m).value.trim() || p.label, amount: a }).eq('id', p.id); if (error) throw error; reload('pending_items'); toast('تم التعديل ✔'); }); });
  $$('[data-pp]').forEach(b => b.onclick = () => { const p = item(+b.dataset.pp), rem = num(p.amount);
    miniModal('تسجيل سداد من المعلق', `<div class="mut">المتبقي الحالي: <b class="num">${fmt(rem)}</b> — اكتب المبلغ الذي سُدِّد الآن (إن كان أقل من المتبقي يبقى الفرق معلقاً)</div><div class="sp"></div><label class="l">المبلغ المسدَّد</label><input id="pp_a" class="num money" inputmode="decimal" value="${mv(rem)}"><div class="sp"></div><label class="l">طريقة السداد</label>${pmSel('pp_m')}`,
    async m => {
      const paid = r2(num($('#pp_a', m).value)), meth = $('#pp_m', m).value; if (!(paid > 0)) throw new Error('أدخل مبلغاً صحيحاً'); if (paid > rem + 0.005) throw new Error('المبلغ أكبر من المتبقي');
      const left = r2(rem - paid);
      let r = await sb.from('pending_items').update({ settled: true, settled_month: cur }).eq('id', p.id); if (r.error) throw r.error;
      if (left > 0.005) { r = await sb.from('pending_items').insert({ month: cur, label: p.label.replace(/ \(متبقي\)$/, '') + ' (متبقي)', kind: p.kind, amount: left, carry: true, settled: false, sale_id: p.sale_id || null }); if (r.error) throw r.error; }
      else if (p.sale_id) { r = await sb.from('sales').update({ is_pending: false, pay_method: meth }).eq('id', p.sale_id); if (r.error) throw r.error; invalidate('sales'); await load('sales'); }
      reload('pending_items'); toast(left > 0.005 ? 'تم تسجيل سداد جزئي ✔ والمتبقي ' + fmt(left) : 'تم السداد بالكامل ✔');
    }); });
}
async function pageTreasury() {
  await load('sales', 'purchases', 'expenses', 'treasury_months', 'pending_items');
  const gs = gridState.tr = gridState.tr || {};
  const reload = async (...k) => { invalidate(...k); await load(...k); draw(); };
  async function addMonth() {
    const last = S.data.treasury_months.map(m => m.month).sort().slice(-1)[0]; let [y, m] = (last || today().slice(0, 7)).split('-').map(Number); if (last) { m++; if (m > 12) { m = 1; y++; } }
    const k = prompt('الشهر الجديد بصيغة YYYY-MM', `${y}-${String(m).padStart(2, '0')}`); if (!k) return; if (!/^\d{4}-\d{2}$/.test(k)) return toast('صيغة غير صحيحة', 1);
    const { error } = await sb.from('treasury_months').insert({ month: k }); if (error) return toast(error.message, 1); gs.month = k; reload('treasury_months');
  }
  const draw = () => {
    const chain = treasuryChain(); if (!chain.length) { $('#page').innerHTML = '<div class="card">لا توجد أشهر بعد. <button class="btn" id="addM">+ إضافة شهر</button></div>'; $('#addM').onclick = addMonth; return; }
    const cur = gs.month && chain.find(x => x.month === gs.month) ? gs.month : (chain.filter(c => c.salesV || c.expenses).slice(-1)[0] || chain[0]).month; gs.month = cur;
    const idx = chain.findIndex(x => x.month === cur), c = chain[idx], prevClosing = idx > 0 ? chain[idx - 1].closing : 0;
    const manual = c.row.opening_override != null, autoOpen = idx > 0 ? prevClosing : 0;
    const items = S.data.pending_items.filter(p => pendActive(p, cur)), settled = S.data.pending_items.filter(p => p.settled && p.settled_month === cur);
    const exps = S.data.expenses.filter(x => x.period === cur), byCat = {}; exps.forEach(x => byCat[x.category] = (byCat[x.category] || 0) + num(x.amount));
    const kinds = ['فاتورة نقدى لم تسدد', 'سلفة', 'أخرى'];
    $('#page').innerHTML = `<div class="row noprint" style="margin-bottom:12px"><div class="fit"><label class="l">الشهر</label><select id="tm">${chain.map(x => `<option value="${x.month}" ${x.month === cur ? 'selected' : ''}>${monthLabel(x.month)}</option>`).join('')}</select></div><div class="fit"><button class="btn gh" id="addM">+ إضافة شهر</button> <button class="btn gh" id="tprint">🖨️ طباعة</button></div></div>
     <div class="grid g2"><div class="card" data-psec data-plabel="اليومية (الوارد)"><h3>اليومية (الوارد)</h3><div class="eq"><span>خزينة قديمة ${manual ? '<span class="tag wa">إدخال يدوي</span>' : '<span class="tag ok">مُرحَّلة تلقائياً</span>'}</span>
        <span style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span style="display:flex;gap:6px;align-items:center"><input id="op" class="num money" inputmode="decimal" style="width:150px" disabled value="${mv(c.opening)}"><button class="btn gh sm noprint" id="opLock" title="فتح للتعديل اليدوي">🔒</button></span>

async function pagePayments(kind) {

  $('#page').innerHTML = `<div class="card noprint wr"><h3>➕ تسجيل دفعة ${isC ? 'من عميل' : 'لناشر'}</h3><div class="grid g4" id="pf">

     ${isC ? '<div><label class="l">رقم الإيصال (اختياري — يُكتب التاريخ تلقائياً)</label><input id="pf_r"></div>' : ''}

     <div><label class="l">الترم</label><select id="pf_t">${TERMS.map(t => `<option ${(st.current_term || 'الاول') === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div></div><div class="sp"></div><button class="btn" id="pfAdd">💾 حفظ الدفعة</button></div>
   <div class="card"><div class="tabs noprint"><button data-tab="det" class="${gs.tab === 'det' ? 'on' : ''}">التفصيلي</button><button data-tab="sum" class="${gs.tab === 'sum' ? 'on' : ''}">ملخص لكل ${isC ? 'عميل' : 'ناشر'}</button></div>
     <div class="row noprint"><div><label class="l">بحث</label><input id="pq" value="${esc(gs.q)}" placeholder="الاسم${isC ? ' أو رقم الإيصال' : ''}"></div><div class="fit"><label class="l">من</label><input type="date" id="pfr" value="${esc(gs.from)}"></div><div class="fit"><label class="l">إلى</label><input type="date" id="pto" value="${esc(gs.to)}"></div><div class="fit"><label class="l">الترم</label><select id="ptm"><option value="">الكل</option>${TERMS.map(t => `<option ${gs.term === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div><div class="fit"><label class="l">طريقة الدفع</label><select id="ppm"><option value="">الكل</option>${PMS.map(x => `<option ${gs.pm === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div><div class="fit"><button class="btn gh" id="pcsv">⬇️ CSV</button> <button class="btn gh" id="pprint">🖨️ طباعة</button></div></div><div class="sp"></div><div id="paybox"></div></div>`;

async function runImport(files) {
  const log = m => { $('#imlog').textContent += m + '\n'; };
  if (!files.length) return toast('اختر الملفات أولاً', 1);
  if (S.data.sales.length && !confirm('يوجد بيانات مبيعات بالفعل. الاستيراد سيضيف فوقها وقد يكرر الحركات. متابعة؟')) return;
  const F = {}; for (const f of files) F[f.name.replace(/\.csv$/i, '')] = parseCsv(await f.text());
  const chunk = async (table, rows) => { for (let i = 0; i < rows.length; i += 500) { const { error } = await sb.from(table).insert(rows.slice(i, i + 500)); if (error) throw new Error(table + ': ' + error.message); } log(`✔ ${table}: ${rows.length}`); };
  try {
    const bool = v => String(v).toLowerCase() === 'true';
    if (F.customers) { const { error } = await sb.from('customers').upsert(F.customers.map(r => ({ name: r.name.trim(), type: r.type || 'اجل', credit_limit: r.credit_limit === '' ? null : num(r.credit_limit), show_in_balances: bool(r.show_in_balances) })), { onConflict: 'name' }); if (error) throw error; log('✔ customers: ' + F.customers.length); }
    if (F.publishers) { const { error } = await sb.from('publishers').upsert(F.publishers.map(r => ({ name: r.name.trim(), show_in_balances: bool(r.show_in_balances) })), { onConflict: 'name' }); if (error) throw error; log('✔ publishers: ' + F.publishers.length); }
    invalidate('customers', 'publishers'); await load('customers', 'publishers');
    const cm = new Map(S.data.customers.map(x => [x.name, x.id])), pm = new Map(S.data.publishers.map(x => [x.name, x.id]));
    const need = (m, n, w) => { if (!m.has(n)) throw new Error(`${w} غير موجود: ${n}`); return m.get(n); };
    if (F.sales) await chunk('sales', F.sales.map(r => ({ invoice_no: r.invoice_no, customer_id: need(cm, r.customer, 'عميل'), invoice_value: num(r.invoice_value), commission: num(r.commission), credit: num(r.credit), payments: num(r.payments), sale_date: r.sale_date || today(), term: r.term || 'الاول', period: r.period || null, source: r.source || 'excel' })));
    if (F.purchases) await chunk('purchases', F.purchases.map(r => ({ publisher_id: need(pm, r.publisher, 'ناشر'), cash_purchases: num(r.cash_purchases), credit_purchases: num(r.credit_purchases), payments: num(r.payments), purchase_date: r.purchase_date || today(), term: r.term || 'الاول', period: r.period || null, source: r.source || 'excel' })));
    if (F.expenses) await chunk('expenses', F.expenses.map(r => ({ category: r.category || 'أخرى', amount: num(r.amount), description: r.description, expense_date: r.expense_date || today(), period: r.period || null })));
    if (F.treasury_months) { const { error } = await sb.from('treasury_months').upsert(F.treasury_months.map(r => ({ month: r.month, opening_override: r.opening_override === '' ? null : num(r.opening_override), cash_box: num(r.cash_box), drawer: num(r.drawer), post: num(r.post), bank: num(r.bank) }))); if (error) throw error; log('✔ treasury_months: ' + F.treasury_months.length); }
    if (F.pending_items) await chunk('pending_items', F.pending_items.map(r => ({ month: r.month, label: r.label, amount: num(r.amount), kind: 'مستورد', carry: false })));
    if (F.customer_returns) await chunk('customer_returns', F.customer_returns.map(r => ({ customer_id: need(cm, r.customer, 'عميل'), term: r.term, amount: num(r.amount), return_date: r.return_date, note: r.note })));
    if (F.publisher_returns) await chunk('publisher_returns', F.publisher_returns.map(r => ({ publisher_id: need(pm, r.publisher, 'ناشر'), term: r.term, amount: num(r.amount), return_date: r.return_date, note: r.note })));
    Object.keys(TABLES).forEach(invalidate); log('اكتمل الاستيراد بنجاح 🎉'); toast('اكتمل الاستيراد ✔');
  } catch (e) { log('✖ ' + e.message); toast(e.message, 1); }
}

      add('publishers', ['الطلبة', 'نهضة مصر', 'الدولية'].map(name => ({ name, show_in_balances: true })));
      const sale = (n, c, v, com, pay, d) => ({ invoice_no: String(n), customer_id: c, invoice_value: v, commission: com, credit: c === 4 ? 0 : v - com, payments: pay, sale_date: '2026-10-' + d, term: 'الاول', period: '2026-10', source: 'demo' });
      add('sales', [sale(1, 1, 30000, 1500, 0, '03'), sale(2, 2, 12000, 600, 5000, '04'), sale(3, 3, 45000, 2250, 20000, '05'), sale(4, 4, 1800, 0, 0, '05'), sale(5, 1, 0, 0, 20000, '12'), sale(6, 2, 9000, 450, 0, '15'), sale(7, 3, 22000, 1100, 0, '20')]);
      add('purchases', [[1, 0, 40000, 0, '02'], [2, 0, 25000, 10000, '06'], [3, 3000, 0, 0, '09'], [1, 0, 0, 15000, '18']].map(([p, cash, cr, pay, d]) => ({ publisher_id: p, cash_purchases: cash, credit_purchases: cr, payments: pay, purchase_date: '2026-10-' + d, term: 'الاول', period: '2026-10', source: 'demo' })));
      add('expenses', [['شحن', 350, 'شحن طلبية', '03'], ['نقل', 200, 'نقل بضاعة', '05'], ['اكرامية', 50, 'اكرامية عمال', '08'], ['مرتبات', 4000, 'مرتب موظف', '25']].map(([category, amount, description, d]) => ({ category, amount, description, expense_date: '2026-10-' + d, period: '2026-10' })));
      add('customer_returns', [{ customer_id: 1, term: 'الاول', amount: 1200, return_date: '2026-10-10', note: 'مرتجع تجريبي' }]);
      add('publisher_returns', [{ publisher_id: 1, term: 'الاول', amount: 800, return_date: '2026-10-11', note: 'مرتجع تجريبي' }]);
      const m0 = D.treasury_months.find(m => m.month === '2026-07'); m0.opening_override = 100000;
      const m10 = D.treasury_months.find(m => m.month === '2026-10'); Object.assign(m10, { cash_box: 5000, drawer: 2000, post: 20000, bank: 10000 });
      D.pending_items.push({ id: 1, month: '2026-10', label: 'فاتورة نقدى لم تسدد (تجريبي)', kind: 'فاتورة نقدى لم تسدد', amount: 1500, carry: true, settled: false, settled_month: null });
      D.sales[4].pay_method = 'بنك'; D.sales[1].pay_method = 'بريد'; D.purchases[3].pay_method = 'بنك'; D.sales.forEach(r => { r.inv_type = r.customer_id === 4 ? 'نقدى' : 'اجل'; r.is_pending = false; const need = num(r.payments) > 0 || (r.inv_type === 'نقدى' && num(r.invoice_value) > 0); r.pay_method = need ? (r.pay_method || 'نقدى') : ''; }); D.purchases.forEach(r => { r.pay_method = (num(r.payments) > 0 || num(r.cash_purchases) > 0) ? (r.pay_method || 'نقدى') : ''; }); D.expenses.forEach(r => { r.pay_method = 'نقدى'; });
      D.adjustments = D.adjustments || []; D.adjustments.push({ id: 1, kind: 'c', customer_id: 1, publisher_id: null, direction: 'drawn', amount: 500, adj_date: '2026-10-14', term: 'الاول', note: 'عمولة تجريبية', created_by: 'demo-admin', created_at: new Date().toISOString() });
      save(); return true;
    }
  };
}

/* ============================ الدخول والإعداد ============================ */
function welcomeScreen() {
  $('#app').innerHTML = `<div class="center"><div class="box" style="max-width:470px"><div class="logo">📚</div><h1>نظام محاسبة المكتبة</h1><p>اختر طريقة التشغيل</p>
   <button class="btn" id="wDemo" style="width:100%;padding:14px">🧪 تجربة فورية (بدون أي إعداد)</button>
   <p class="mut" style="margin:6px 0 16px;font-size:13px">قاعدة فارغة بنفس هيكل ملف Excel، محفوظة داخل متصفحك فقط. مناسبة للاختبار قبل التشغيل الفعلي، ويمكنك تبديل الدور بين مدير وموظف وقراءة فقط.</p>
   <button class="btn gh" id="wCloud" style="width:100%;padding:14px">☁️ الاتصال بـ Supabase (التشغيل السحابي)</button></div></div>`;
  $('#wDemo').onclick = () => { lsSet('mode', 'demo'); location.reload(); };
  $('#wCloud').onclick = setupScreen;
}
function setupScreen() {
  $('#app').innerHTML = `<div class="center"><div class="box"><div class="logo">⚙️</div><h1>إعداد الاتصال</h1><p>أدخل بيانات مشروع Supabase (Project Settings ▸ API)</p><label class="l">Project URL</label><input id="u" dir="ltr" placeholder="https://xxxx.supabase.co"><div class="sp"></div><label class="l">anon public key</label><input id="k" dir="ltr"><div class="sp"></div><button class="btn" id="go" style="width:100%">حفظ ومتابعة</button></div></div>`;
  $('#go').onclick = () => { const u = $('#u').value.trim(), k = $('#k').value.trim(); if (!/^https:\/\/.+/.test(u) || k.length < 20) return toast('بيانات غير صحيحة', 1); lsSet('sb_url', u); lsSet('sb_key', k); location.reload(); };
}
function loginScreen() {
  $('#app').innerHTML = `<div class="center"><form class="box" id="lf"><img src="logo.PNG" alt="لوجو المكتبة" style="height:64px;max-width:100%;object-fit:contain;margin-bottom:12px"><h1>First-Bookshop</h1><p>سجّل الدخول للمتابعة</p><label class="l">البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="username" required><div class="sp"></div><label class="l">كلمة المرور</label><input id="pw" type="password" dir="ltr" autocomplete="current-password" required><div class="sp"></div><button class="btn" id="lb" style="width:100%">دخول</button></form></div>`;
  $('#lf').onsubmit = async ev => { ev.preventDefault(); const b = $('#lb'); b.disabled = true; const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value }); b.disabled = false; if (error) return toast(error.message === 'Invalid login credentials' ? 'البريد أو كلمة المرور غير صحيحة' : error.message, 1); boot(); };
}
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginScreen();
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error || !prof) { $('#app').innerHTML = `<div class="center"><div class="box"><h1>لا يوجد ملف مستخدم</h1><p>تأكد من تشغيل ملف schema.sql ثم أعد الدخول.</p><button class="btn" id="o2">خروج</button></div></div>`; $('#o2').onclick = async () => { await sb.auth.signOut(); location.reload(); }; return; }
  if (!prof.active) { await sb.auth.signOut(); loginScreen(); return toast('هذا الحساب موقوف، تواصل مع المدير', 1); }
  me = prof; prefPull(session.user); try { await load('app_settings'); lsSet('logo_cache', settings().logo || ''); lsSet('name_cache', settings().store_name || ''); } catch (e) {} applyBrand(); renderShell(); startRealtime();
  window.addEventListener('hashchange', route); route();
}
applyBrand();
document.documentElement.dataset.theme = (['soft', 'sepia', 'dark', 'light'].includes(lsGet('theme', 'soft')) ? lsGet('theme', 'soft') : 'soft');
(function init() {
  if (!PRODUCTION && lsGet('mode', '') === 'demo') { DEMO = true; sb = makeLocalClient(lsGet('demo_role', 'admin')); boot(); return; }
  const url = SUPABASE_URL || lsGet('sb_url', ''), key = SUPABASE_ANON_KEY || lsGet('sb_key', '');
  if (!url || !key) return PRODUCTION ? setupScreen() : welcomeScreen();
  if (!window.supabase) { $('#app').innerHTML = '<div class="center"><div class="box"><h1>تعذّر تحميل مكتبة Supabase</h1><p>تأكد من الاتصال بالإنترنت ثم أعد التحميل.</p>' + (PRODUCTION ? '' : '<button class="btn" id="wd">🧪 فتح الوضع التجريبي</button>') + '</div></div>'; if ($('#wd')) $('#wd').onclick = () => { lsSet('mode', 'demo'); location.reload(); }; return; }
  sb = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true } });
  boot();
})();</script>
